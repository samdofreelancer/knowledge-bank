name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # Allow manual trigger
  workflow_dispatch:

# Allow GitHub Pages to build and deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

  test-links:
    name: Test Links (PR only)
    runs-on: ubuntu-latest
    container: node:24
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build

      - name: Check links
        run: |
          npm install -g broken-link-checker
          blc http://localhost:3000 -r -e \
            --exclude-external \
            --exclude-external \
            --timeout 30000 || true

  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          echo "Checking for common issues..."
          find docs -name "*.md" | while read file; do
            if grep -q '\[^[^]]*\]' "$file"; then
              echo "Warning: Suspicious markdown in $file"
            fi
          done

      - name: Lint markdown
        run: |
          npm install -g markdownlint-cli
          markdownlint docs/**/*.md --fix || true

      - name: Check for broken references
        run: |
          npm install -g remark-cli remark-validate-links
          remark docs/**/*.md -u validate-links || true

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure() && github.event_name == 'push'
    steps:
      - name: Create Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Documentation Build Failed',
              body: `Build failed for commit ${context.sha}\n\n[View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})`
            })
