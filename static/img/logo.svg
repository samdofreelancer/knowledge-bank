<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer circle background -->
  <circle cx="100" cy="100" r="95" fill="#0070C9" opacity="0.1"/>
  
  <!-- DevOps Infinity Symbol -->
  <path d="M 50 100 C 50 75 70 60 85 60 C 100 60 110 75 110 85 L 110 115 C 110 125 100 140 85 140 C 70 140 50 125 50 100 Z" 
        fill="none" stroke="#0070C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <path d="M 150 100 C 150 75 130 60 115 60 C 100 60 90 75 90 85 L 90 115 C 90 125 100 140 115 140 C 130 140 150 125 150 100 Z" 
        fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center connecting dot -->
  <circle cx="100" cy="100" r="4" fill="#4ECDC4"/>
  
  <!-- Top development element (code brackets) -->
  <g transform="translate(100, 35)">
    <path d="M -8 -5 L -12 0 L -8 5" stroke="#0070C9" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 8 -5 L 12 0 L 8 5" stroke="#0070C9" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom operations element (gear) -->
  <g transform="translate(100, 165)">
    <circle cx="0" cy="0" r="6" fill="#FF6B6B"/>
    <circle cx="0" cy="0" r="4" fill="white"/>
    <!-- Gear teeth -->
    <rect x="-1" y="-10" width="2" height="4" fill="#FF6B6B"/>
    <rect x="-1" y="6" width="2" height="4" fill="#FF6B6B"/>
    <rect x="-10" y="-1" width="4" height="2" fill="#FF6B6B"/>
    <rect x="6" y="-1" width="4" height="2" fill="#FF6B6B"/>
  </g>
  
  <!-- Text label -->
  <text x="100" y="190" font-size="16" font-weight="bold" text-anchor="middle" fill="#0070C9" font-family="Arial, sans-serif">
    DevOps
  </text>
</svg>